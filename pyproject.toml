[project]
name = "smartstock"
version = "1.0.0"
description = "Demand-aware supermarket inventory replenishment engine with AI Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "mangum>=0.17.0",
    "google-generativeai>=0.8.0",
    "google-genai>=0.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
